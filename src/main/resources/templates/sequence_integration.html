<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Sequence Diagram</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/bower_components/bower-webfontloader/webfont.js"></script>
    <script src="/bower_components/snap.svg/dist/snap.svg-min.js"/></script>
    <script src="/bower_components/underscore/underscore-min.js"/></script>
    <script src="/bower_components/js-sequence-diagrams/dist/sequence-diagram.js"/></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link href="/bower_components/js-sequence-diagrams/dist/sequence-diagram.css" rel="stylesheet"/>
    <link href="/css/toastr.min.css" rel="stylesheet"/>
    <link href="/css/sequenceDiagram.css" rel="stylesheet"/>
</head>
<body>
  <div id="container">

      <!-- Modal -->
      <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
              <div class="modal-content">
                  <div class="modal-header">

                  </div>
                  <div class="modal-body">

                  </div>
                  <div class="modal-footer">
                      <div class="btn-group" role="group" aria-label="..." style="margin:0 auto">

                          <button type="button" class="btn btn-default" id="left" onclick="previousInfoPacket()">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                                  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                              </svg>
                          </button>

                          <button type="button" class="btn btn-default" id="right" onclick="nextInfoPacket()">
                              <svg  width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                                  <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
                              </svg>
                          </button>
                      </div>
                      <button id="close-modal" type="button" class="btn btn-secondary" >Close</button>
                  </div>
              </div>
          </div>
      </div>

      <!-- Loading modal -->
      <div class="modal fade" id="loadingModal" tabindex="-1" role="dialog" aria-labelledby="loadingModal" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered" role="document">
              <div class="modal-content">
                  <div class="modal-header">

                  </div>
                  <div class="modal-body">
                      <div class="spinner-border" style="width: 3.5rem; height: 3.5rem; text-align: center" role="status">

                      </div>
                      <span class="sr-only">Loading...</span>
                  </div>
                  <div class="modal-footer">

                  </div>
              </div>
          </div>
      </div>

      <!-- Filters -->
        <div class="mb-3" style="width: 100%; display: inline-block; padding: 1%;">
            <p>
            <button class="btn btn-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
                Filters
            </button>
            </p>
            <div class="collapse" id="collapseExample">
                <div class="card card-body">
                    <div class="container">
                        <div class="row justify-content-start">
                            <div class="col-3">
                                <label class="form-label">*Start date</label>
                                <input type="datetime-local" class="form-control" placeholder="Start date" aria-label="Server" id="start_date" step="2" required>
                            </div>
                            <div class="col-3">
                                <label class="form-label">*End date</label>
                                <input type="datetime-local" class="form-control" placeholder="End date" aria-label="Server" id="end_date" step="2" required>
                            </div>
                            <div class="col-4">
                                <label class="form-label">IMSI</label>
                                <input type="number" class="form-control" placeholder="IMSI" aria-label="Server" id="imsi" step="2">
                            </div>
                        </div>
                        <div class="row justify-content-start my-4">

                            <div class="col-3">
                                <label class="form-label">Filter Logic</label>
                                <select class="form-select" aria-label="Filter logic" id="filter_logic">
                                    <option value="AND">AND</option>
                                    <option value="OR">OR</option>
                                </select>
                            </div>
                            <div class="col-3">
                                <label class="form-label">End to End ID</label>
                                <input type="text" class="form-control" placeholder="End to End ID" aria-label="Server" id="endtoend_id" step="2">
                            </div>
                            <div class="col-2">
                                <label class="form-label">IP Source</label>
                                <input type="text" class="form-control" placeholder="IP Source" aria-label="Server" id="ip_src" step="2">
                            </div>
                            <div class="col-2">
                                <label class="form-label">IP Destination</label>
                                <input type="text" class="form-control" placeholder="IP Destination" aria-label="Server" id="ip_dst" step="2">
                            </div>
                        </div>
                        <br/>
                        <div class="row justify-content-end">
                            <div class="col-2">
                                <button id="apply" class="btn btn-secondary float-end" type="button" onClick="updateDiagram()">Apply</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div  id="diagram" style="width: 100%; overflow-x: auto; overflow-y: hidden; background: #F7F7F7; margin-top:1%;"></div>
        </div>

          <div id="scroll1" style="overflow-x:auto;">
              <div></div>
          </div>
          <div class="mb-3 scroll2" id="pivot-table" style="overflow-x:auto;">
              <table class='table table-striped' id='select'>

              </table>
          </div>

      <form>
          <div class="col-2">
              <input id="download-pcap-btn" class="btn btn-secondary" value="Download PCAP" onclick="buildPcap()" disabled/>
          </div>
      </form>


    <script src="/js/toastr.min.js"></script>
    <script src="/js/sequenceDiagram.js"></script>
</body>
</html>
